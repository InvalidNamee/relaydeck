name: desktop-build

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test shared code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  desktop:
    name: Build ${{ matrix.label }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS-arm64
            os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: relaydeck-macos-arm64
            paths: |
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Relaydeck.app
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - label: Windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: relaydeck-windows-x64
            paths: |
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci --ignore-scripts
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target ${{ matrix.target }}
      - run: npm run build:packages
      - run: npm run tauri -w @relaydeck/desktop -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
