[package]
name = "relaydeck-client"
version = "0.1.0"
description = "Relaydeck LAN browser control client"
authors = ["Relaydeck contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "relaydeck_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
